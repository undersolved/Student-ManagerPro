<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Student Manager Pro - Students</title>

		<link rel="stylesheet" href="css/style.css" />
	</head>

	<body>
		<header class="navbar">
			<h1>🎓 Student Manager Pro</h1>

			<nav>
				<a href="index.html">Dashboard</a>
				<a href="students.html" class="active">Students</a>
			</nav>
		</header>

		<div id="toast" class="toast"></div>

		<div class="container">
			<div class="form-header">
				<h2 id="formTitle">Add Student</h2>

				<button id="cancelEdit" class="secondary-button">Cancel</button>
			</div>

			<form id="studentForm" class="form-grid">
				<input id="name" type="text" placeholder="Student Name" required />

				<input
					id="roll_number"
					type="number"
					placeholder="Roll Number"
					required />

				<input id="student_class" type="text" placeholder="Class" required />

				<input id="section" type="text" placeholder="Section" required />

				<input id="age" type="number" placeholder="Age" required />

				<input id="email" type="email" placeholder="Email" required />

				<input id="phone" type="text" placeholder="Phone Number" required />

				<input
					id="attendance"
					type="number"
					min="0"
					max="100"
					placeholder="Attendance" />

				<select id="fee_status">
					<option value="Paid">Paid</option>
					<option value="Pending">Pending</option>
				</select>

				<button id="saveButton" type="submit" class="button">
					Save Student
				</button>
			</form>

			<div class="search-box">
				<input
					id="searchInput"
					type="text"
					placeholder="Search by name or roll number..." />
			</div>

			<div class="table-container">
				<table>
					<thead>
						<tr>
							<th>ID</th>
							<th>Name</th>
							<th>Roll</th>
							<th>Class</th>
							<th>Attendance</th>
							<th>Fee Status</th>
							<th>Actions</th>
						</tr>
					</thead>

					<tbody id="studentTable">
						<tr>
							<td colspan="7" class="empty">No students found.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<script src="js/api.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
