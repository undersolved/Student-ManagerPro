<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Student Manager Pro</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
			rel="stylesheet" />

		<link rel="stylesheet" href="css/style.css" />
	</head>

	<body class="green-theme">
		<header class="navbar glass">
			<a href="/" class="logo"> 🌿 Student Manager Pro </a>

			<nav>
				<a href="/">Dashboard</a>
				<a href="/students" class="active">Students</a>
			</nav>
		</header>

		<div id="toast" class="toast"></div>

		<div class="container glass">
			<div class="form-header">
				<h2 id="formTitle">Student Details</h2>

				<button id="cancelEdit" class="secondary-button" type="button">
					Cancel
				</button>
			</div>

			<form id="studentForm" class="form-grid">
				<input id="name" type="text" placeholder="Student Name" required />

				<input
					id="roll_number"
					type="number"
					placeholder="Roll Number"
					required />

				<input id="student_class" type="text" placeholder="Class" required />

				<input id="section" type="text" placeholder="Section" required />

				<input id="age" type="number" placeholder="Age" required />

				<input id="email" type="email" placeholder="Email" required />

				<input
					id="phone"
					type="tel"
					placeholder="Phone Number"
					maxlength="10"
					required />

				<input
					id="attendance"
					type="number"
					min="0"
					max="100"
					placeholder="Attendance" />

				<select id="fee_status">
					<option value="Paid">Paid</option>
					<option value="Pending">Pending</option>
				</select>

				<button id="saveButton" type="submit" class="button">
					Save Student
				</button>
			</form>

			<div class="search-box">
				<input
					id="searchInput"
					type="text"
					placeholder="Search by name or roll number..." />
			</div>

			<div class="table-container glass">
				<table>
					<thead>
						<tr>
							<th>ID</th>
							<th>Name</th>
							<th>Roll</th>
							<th>Class</th>
							<th>Section</th>
							<th>Age</th>
							<th>Email</th>
							<th>Phone</th>
							<th>Attendance</th>
							<th>Fee</th>
							<th>Actions</th>
						</tr>
					</thead>

					<tbody id="studentTable">
						<tr>
							<td colspan="11" class="empty">No students found.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<script src="js/api.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
